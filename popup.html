<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #f1f1f1;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid #272727;
    }

    .header .logo {
      font-size: 18px;
    }

    .header .title {
      font-size: 14px;
      font-weight: 600;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }

    .row .label {
      font-size: 14px;
    }

    .row .status {
      font-size: 12px;
      color: #aaa;
      margin-top: 2px;
    }

    .status.on {
      color: #3ea6ff;
    }

    /* 토글 스위치 */
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #3f3f3f;
      border-radius: 24px;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #f1f1f1;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch input:checked + .slider {
      background: #3ea6ff;
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    .footer {
      padding: 10px 16px 14px;
      border-top: 1px solid #272727;
      font-size: 11px;
      color: #717171;
      line-height: 1.6;
    }

    .footer kbd {
      background: #272727;
      border-radius: 4px;
      padding: 1px 5px;
      font-family: inherit;
      font-size: 11px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">⏭️</span>
    <span class="title">Shorts Auto Next</span>
  </div>

  <div class="row">
    <div>
      <div class="label">자동 넘김</div>
      <div class="status" id="status">불러오는 중...</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="row" style="padding-top: 0;">
    <div>
      <div class="label">광고 자동 넘기기</div>
      <div class="status" id="statusAds">불러오는 중...</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggleAds">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer">
    쇼츠 페이지에서 <kbd>Alt</kbd> + <kbd>N</kbd> 으로도<br>
    켜고 끌 수 있습니다.
  </div>

  <script src="popup.js"></script>
</body>
</html>
